<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 930" width="1420" height="930" font-family="Helvetica, Arial, sans-serif">
  <title>WaveForge architecture</title>
  <defs>
    <marker id="a-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a97ad"/></marker>
    <marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6bf6ff"/></marker>
    <marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b18cff"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ffb547"/></marker>
    <style>
      .box { fill: #0b0f1a; stroke: rgba(107,246,255,0.35); stroke-width: 1.2; }
      .name { fill: #e6f1ff; font-size: 16px; font-weight: 700; }
      .sub { fill: #8a97ad; font-size: 12px; }
      .mono { font-family: Menlo, Consolas, monospace; }
      .eyebrow { fill: #6bf6ff; font-size: 11px; letter-spacing: 1.5px; font-family: Menlo, Consolas, monospace; }
      .tag { fill: #b9c4d6; font-size: 11px; font-family: Menlo, Consolas, monospace; }
      .flow { fill: none; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1420" height="930" fill="#05060b"/>

  <!-- title -->
  <text x="40" y="58" fill="#e6f1ff" font-size="30" font-weight="700" letter-spacing="2">WAVEFORGE</text>
  <text x="40" y="86" class="sub" font-size="15">Architecture · video in; audio, transcripts, answers, cloned voices and dubs out</text>

  <!-- frontend + user -->
  <rect class="box" x="40" y="150" width="200" height="96" rx="10"/>
  <text class="eyebrow" x="58" y="174">FRONTEND</text>
  <text class="name" x="58" y="198">Next.js 14</text>
  <text class="sub" x="58" y="217">on Vercel</text>
  <text class="sub" x="58" y="234">deploys on git push</text>

  <rect class="box" x="40" y="590" width="200" height="120" rx="10"/>
  <text class="eyebrow" x="58" y="614">USER</text>
  <text class="name" x="58" y="638">Browser</text>
  <text class="sub" x="58" y="659">upload · files · demo</text>
  <text class="sub" x="58" y="677">live mic + streamed audio</text>

  <path class="flow" d="M140 590 V250" stroke="#8a97ad" marker-end="url(#a-fg)"/>
  <text class="sub" x="150" y="424">loads the app</text>
  <path class="flow" d="M240 650 H326" stroke="#8a97ad" marker-end="url(#a-fg)"/>
  <text class="tag" x="268" y="640" text-anchor="middle">HTTPS</text>

  <!-- message bus -->
  <rect x="300" y="140" width="760" height="96" rx="10" fill="#0b0f1a" stroke="#6bf6ff" stroke-width="1.4"/>
  <text x="320" y="171" fill="#e6f1ff" font-size="18" font-weight="700">RabbitMQ</text>
  <text class="sub" x="410" y="171">CloudAMQP · 4 queues + 1 fanout exchange</text>
  <rect x="320" y="190" width="130" height="30" rx="15" fill="rgba(107,246,255,0.08)" stroke="#6bf6ff"/>
  <text class="tag" x="385" y="210" text-anchor="middle">file_uploaded</text>
  <rect x="462" y="190" width="310" height="30" rx="15" fill="rgba(177,140,255,0.08)" stroke="#b18cff"/>
  <text class="tag" x="617" y="210" text-anchor="middle">file_converted (fanout) → ai, notification</text>
  <rect x="784" y="190" width="128" height="30" rx="15" fill="rgba(255,181,71,0.08)" stroke="#ffb547"/>
  <text class="tag" x="848" y="210" text-anchor="middle">dub_requested</text>

  <!-- the VM -->
  <rect x="300" y="310" width="760" height="430" rx="14" fill="none" stroke="rgba(230,241,255,0.25)" stroke-dasharray="6 6"/>
  <text class="tag" x="318" y="730">ORACLE CLOUD ALWAYS FREE VM (1 GB) · DOCKER COMPOSE</text>

  <!-- workers -->
  <rect class="box" x="330" y="360" width="190" height="110" rx="10"/>
  <text class="name" x="346" y="386">Converter</text>
  <text class="sub mono" x="346" y="405">Python · ffmpeg</text>
  <text class="sub" x="346" y="424">MP3 / WAV, resampling</text>
  <circle cx="350" cy="450" r="4" fill="#4ade80"/><text class="tag" x="358" y="454">GridFS</text>
  <circle cx="418" cy="450" r="4" fill="#ffb547"/><text class="tag" x="426" y="454">Cloudinary</text>

  <rect class="box" x="550" y="360" width="250" height="160" rx="10" stroke="#b18cff"/>
  <text class="name" x="566" y="386">AI service</text>
  <text class="sub mono" x="566" y="405">Python · HTTP + 2 consumers</text>
  <text class="sub" x="566" y="425">transcripts · Q&amp;A · summaries</text>
  <text class="sub" x="566" y="443">voice clones · dubbing · live mode</text>
  <circle cx="570" cy="470" r="4" fill="#60a5fa"/><text class="tag" x="578" y="474">PostgreSQL</text>
  <circle cx="670" cy="470" r="4" fill="#4ade80"/><text class="tag" x="678" y="474">GridFS</text>
  <circle cx="570" cy="494" r="4" fill="#ffb547"/><text class="tag" x="578" y="498">Cloudinary</text>
  <circle cx="670" cy="494" r="4" fill="#b18cff"/><text class="tag" x="678" y="498">Groq</text>
  <circle cx="725" cy="494" r="4" fill="#ff7ab6"/><text class="tag" x="733" y="498">Fish</text>

  <rect class="box" x="830" y="360" width="200" height="110" rx="10"/>
  <text class="name" x="846" y="386">Notifier</text>
  <text class="sub mono" x="846" y="405">Node.js · amqplib</text>
  <text class="sub" x="846" y="424">email when audio is ready</text>
  <circle cx="850" cy="450" r="4" fill="#ff5c7a"/><text class="tag" x="858" y="454">Mailgun</text>

  <!-- request path -->
  <rect class="box" x="330" y="600" width="130" height="100" rx="10"/>
  <text class="name" x="346" y="628">Caddy</text>
  <text class="sub" x="346" y="649">auto HTTPS</text>
  <text class="sub" x="346" y="667">reverse proxy</text>

  <rect class="box" x="500" y="590" width="220" height="120" rx="10" stroke="#6bf6ff"/>
  <text class="name" x="516" y="616">API gateway</text>
  <text class="sub mono" x="516" y="635">Go · Gin</text>
  <text class="sub" x="516" y="655">JWT check · uploads</text>
  <text class="sub" x="516" y="673">/ai/* proxy · public /demo</text>
  <circle cx="520" cy="694" r="4" fill="#4ade80"/><text class="tag" x="528" y="698">GridFS</text>

  <rect class="box" x="770" y="590" width="260" height="120" rx="10"/>
  <text class="name" x="786" y="616">Auth service</text>
  <text class="sub mono" x="786" y="635">Go · Gin · internal only</text>
  <text class="sub" x="786" y="655">bcrypt · JWT · file records</text>
  <text class="sub" x="786" y="673">status updates from every worker</text>
  <circle cx="790" cy="694" r="4" fill="#60a5fa"/><text class="tag" x="798" y="698">PostgreSQL</text>

  <path class="flow" d="M460 650 H496" stroke="#8a97ad" marker-end="url(#a-fg)"/>
  <path class="flow" d="M720 650 H766" stroke="#8a97ad" marker-end="url(#a-fg)"/>
  <text class="tag" x="743" y="640" text-anchor="middle">JWT</text>
  <path class="flow" d="M680 590 V524" stroke="#8a97ad" marker-end="url(#a-fg)"/>
  <text class="tag" x="688" y="562">/ai/*</text>

  <!-- queue flows: colour = queue -->
  <path class="flow" d="M535 590 V240" stroke="#6bf6ff" marker-end="url(#a-cyan)"/>
  <path class="flow" d="M400 236 V356" stroke="#6bf6ff" marker-end="url(#a-cyan)"/>
  <path class="flow" d="M470 360 V240" stroke="#b18cff" marker-end="url(#a-violet)"/>
  <path class="flow" d="M640 236 V356" stroke="#b18cff" marker-end="url(#a-violet)"/>
  <path class="flow" d="M930 236 V356" stroke="#b18cff" marker-end="url(#a-violet)"/>
  <path class="flow" d="M760 356 V240" stroke="#ffb547" marker-start="url(#a-amber)" marker-end="url(#a-amber)"/>

  <!-- CI/CD -->
  <rect class="box" x="300" y="790" width="170" height="90" rx="10"/>
  <text class="name" x="316" y="818">GitHub</text>
  <text class="sub" x="316" y="838">push to main</text>
  <rect class="box" x="520" y="790" width="250" height="90" rx="10"/>
  <text class="name" x="536" y="818">GitHub Actions</text>
  <text class="sub" x="536" y="838">5 images built in parallel</text>
  <text class="sub" x="536" y="856">layer cache · under 1 min</text>
  <rect class="box" x="820" y="790" width="240" height="90" rx="10"/>
  <text class="name" x="836" y="818">GHCR</text>
  <text class="sub" x="836" y="838">public images</text>
  <text class="sub" x="836" y="856">Go images ~12 MB, distroless</text>
  <path class="flow" d="M470 835 H516" stroke="#8a97ad" marker-end="url(#a-fg)"/>
  <path class="flow" d="M770 835 H816" stroke="#8a97ad" marker-end="url(#a-fg)"/>
  <path class="flow" d="M940 790 V744" stroke="#8a97ad" marker-end="url(#a-fg)"/>
  <text class="tag" x="950" y="771">pull + restart, ~1 min</text>

  <!-- managed services -->
  <text x="1110" y="156" fill="#8a97ad" font-size="13" font-weight="700" letter-spacing="1.5">MANAGED SERVICES · FREE TIERS</text>
  <g>
    <rect class="box" x="1110" y="172" width="280" height="88" rx="10"/><rect x="1110" y="172" width="5" height="88" rx="2" fill="#4ade80"/>
    <text class="name" x="1130" y="202">MongoDB Atlas</text>
    <text class="sub" x="1130" y="224">GridFS · original uploads</text>
    <text class="sub" x="1130" y="242">read again for dubbing</text>
  </g>
  <g>
    <rect class="box" x="1110" y="272" width="280" height="88" rx="10"/><rect x="1110" y="272" width="5" height="88" rx="2" fill="#60a5fa"/>
    <text class="name" x="1130" y="302">PostgreSQL · Neon</text>
    <text class="sub" x="1130" y="324">users · file status · dubs · usage caps</text>
    <text class="sub" x="1130" y="342">transcripts in tsvector + GIN index</text>
  </g>
  <g>
    <rect class="box" x="1110" y="372" width="280" height="88" rx="10"/><rect x="1110" y="372" width="5" height="88" rx="2" fill="#ffb547"/>
    <text class="name" x="1130" y="402">Cloudinary</text>
    <text class="sub" x="1130" y="424">converted audio · voice clips</text>
    <text class="sub" x="1130" y="442">dubbed video · voice samples</text>
  </g>
  <g>
    <rect class="box" x="1110" y="472" width="280" height="88" rx="10"/><rect x="1110" y="472" width="5" height="88" rx="2" fill="#b18cff"/>
    <text class="name" x="1130" y="502">Groq</text>
    <text class="sub" x="1130" y="524">Whisper large-v3-turbo</text>
    <text class="sub" x="1130" y="542">gpt-oss-120b · Qwen 3.8 27B</text>
  </g>
  <g>
    <rect class="box" x="1110" y="572" width="280" height="88" rx="10"/><rect x="1110" y="572" width="5" height="88" rx="2" fill="#ff7ab6"/>
    <text class="name" x="1130" y="602">Fish Audio</text>
    <text class="sub" x="1130" y="624">zero-shot voice cloning</text>
    <text class="sub" x="1130" y="642">streamed speech for live mode</text>
  </g>
  <g>
    <rect class="box" x="1110" y="672" width="280" height="88" rx="10"/><rect x="1110" y="672" width="5" height="88" rx="2" fill="#ff5c7a"/>
    <text class="name" x="1130" y="702">Mailgun</text>
    <text class="sub" x="1130" y="724">"your audio is ready" email</text>
    <text class="sub" x="1130" y="742">from a verified custom domain</text>
  </g>

  <text class="sub" x="40" y="912">Coloured dots inside a service mark which managed services it uses. Queue lines use the queue's colour. Total running cost: $0 / month.</text>
</svg>
