# Backend. Copy each service's .env.example to .env and fill it in, then:
#   local development: docker compose up -d --build   (builds from source)
#   server:            docker compose pull && docker compose up -d   (images built by GitHub Actions)
# Postgres (Neon), MongoDB (Atlas), RabbitMQ (CloudAMQP), Cloudinary and Mailgun are external services.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      # plain http://localhost locally; set a real domain in production and Caddy adds HTTPS
      API_DOMAIN: ${API_DOMAIN:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [gateway]

  gateway:
    image: ghcr.io/sudeepgowda55/waveforge-gateway:latest
    build: ./gateway-service
    restart: unless-stopped
    env_file: ./gateway-service/.env
    environment:
      AUTHENTICATION_SERVICE_URL: http://auth:8001
      AI_SERVICE_URL: http://ai:8002
    depends_on: [auth]

  auth:
    image: ghcr.io/sudeepgowda55/waveforge-auth:latest
    build: ./authentication_service
    restart: unless-stopped
    env_file: ./authentication_service/.env

  converter:
    image: ghcr.io/sudeepgowda55/waveforge-converter:latest
    build: ./converter-service
    restart: unless-stopped
    env_file: ./converter-service/.env
    environment:
      AUTH_SERVICE_URL: http://auth:8001
    depends_on: [auth]

  ai:
    image: ghcr.io/sudeepgowda55/waveforge-ai:latest
    build: ./ai-service
    restart: unless-stopped
    env_file: ./ai-service/.env
    environment:
      AUTH_SERVICE_URL: http://auth:8001
    depends_on: [auth]

  notifier:
    image: ghcr.io/sudeepgowda55/waveforge-notifier:latest
    build: ./notification_service
    restart: unless-stopped
    env_file: ./notification_service/.env

volumes:
  caddy_data:
